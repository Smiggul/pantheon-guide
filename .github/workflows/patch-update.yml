name: Auto patch update

# Detects a new League (Data Dragon) patch and opens a PR that refreshes the
# bundled assets and every file generated from them: LCU id tables, the Rift
# item list, summoner spells, the skin list and ability text. League patches
# land roughly every two weeks. It checks twice a day: a run with no new patch
# exits at the version check in seconds, so frequent runs cost almost nothing.
# The old every-3-days schedule left a patch unnoticed for up to three days
# (26.21 slipped that way).
# The schedule only fires from the default branch (frge-gg).
#
# Requires (one-time repo setting): Settings → Actions → General → Workflow
# permissions → "Allow GitHub Actions to create and approve pull requests".

on:
  schedule:
    - cron: "17 6,18 * * *" # 06:17 and 18:17 UTC, every day
  workflow_dispatch: {} # allow a manual run from the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: patch-update
  cancel-in-progress: false

jobs:
  patch-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check for a new patch
        id: check
        run: node helpers/check-patch.mjs

      - name: Install dependencies
        if: steps.check.outputs.outdated == 'true'
        run: npm ci

      - name: Snapshot the current patch's data (for the diff)
        if: steps.check.outputs.outdated == 'true'
        run: |
          mkdir -p .patch-snapshot
          cp public/ddragon/data/item.json          .patch-snapshot/ || true
          cp public/ddragon/data/runesReforged.json .patch-snapshot/ || true

      - name: Pull new Data Dragon assets
        if: steps.check.outputs.outdated == 'true'
        run: python helpers/setup_ddragon.py # no args = latest patch, incremental

      - name: Regenerate LCU id tables
        if: steps.check.outputs.outdated == 'true'
        run: node helpers/gen-lcu-data.mjs # pins to the refreshed version.txt

      # The rest of the data the app reads that is generated from Riot's files.
      # Each generator pins to the refreshed version.txt. They used to be run by
      # hand, and sr-items.json sat on 16.17.1 for four patches. Riot is the only
      # source here, the same CDN setup_ddragon just used, so a failure fails the
      # run, as gen-lcu-data does.
      - name: Regenerate the Rift item list, summoner spells and skin list
        if: steps.check.outputs.outdated == 'true'
        run: |
          node helpers/gen-sr-items.mjs
          node helpers/gen-summoner-spells.mjs
          node helpers/gen-champ-skins.mjs

      - name: Work out which champions this patch affects
        id: diff
        if: steps.check.outputs.outdated == 'true'
        run: >
          node helpers/patch-diff.mjs --before .patch-snapshot
          --from ${{ steps.check.outputs.local }}
          --to ${{ steps.check.outputs.latest }}
          --out patch-report.md

      - name: Read Riot's patch notes
        id: notes
        if: steps.check.outputs.outdated == 'true'
        continue-on-error: true   # notes often publish a few hours after the client patch
        run: node helpers/patch-notes.mjs --out patch-notes.md

      - name: Fold the notes into the report
        if: steps.check.outputs.outdated == 'true'
        run: |
          if [ -s patch-notes.md ]; then
            printf '\n---\n\n' >> patch-report.md
            cat patch-notes.md >> patch-report.md
          fi

      # Ability prose comes from Meraki, a third party with no per-patch data
      # (see gen-abilities.mjs); cooldown, cost and range come from Data Dragon.
      # The generator refuses to write a degraded file, so a Meraki outage keeps
      # the previous abilities.js and says so in the PR instead of failing the
      # whole update. It runs here, not beside the generators above, because it
      # reports into patch-report.md, which the diff step creates.
      - name: Regenerate ability text
        if: steps.check.outputs.outdated == 'true'
        run: |
          if ! node helpers/gen-abilities.mjs > gen-abilities.txt 2>&1; then
            printf '\n---\n\n### Ability text not regenerated\n\n`src/data/abilities.js` still holds the previous patch. Re-run `node helpers/gen-abilities.mjs` once the cause below is fixed.\n\n```\n' >> patch-report.md
            cat gen-abilities.txt >> patch-report.md
            printf '```\n' >> patch-report.md
          fi
          cat gen-abilities.txt

      # A removed or Arena-only item still has a NAME in Data Dragon, so the diff
      # and the build both pass it. This asks Riot's own map flags instead, and
      # reports into the PR rather than failing: the PR is where a human fixes it.
      - name: Check every recommended item is sold on the Rift
        if: steps.check.outputs.outdated == 'true'
        run: |
          if ! node helpers/check-sr-items.mjs > sr-items.txt 2>&1; then
            printf '\n---\n\n### Recommended items not sold on the Rift\n\n```\n' >> patch-report.md
            cat sr-items.txt >> patch-report.md
            printf '```\n' >> patch-report.md
          fi
          cat sr-items.txt

      - name: Build (verify the patch didn't break anything)
        if: steps.check.outputs.outdated == 'true'
        run: npm run build

      - name: Drop the snapshot (never commit it)
        if: steps.check.outputs.outdated == 'true'
        run: rm -rf .patch-snapshot

      - name: Open pull request
        if: steps.check.outputs.outdated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/ddragon-${{ steps.check.outputs.latest }}
          commit-message: "Update to Data Dragon patch ${{ steps.check.outputs.latest }}"
          title: "Auto: patch ${{ steps.check.outputs.latest }}${{ steps.diff.outputs.broken != '0' && ' — ⚠ broken references' || '' }} (${{ steps.diff.outputs.affected }} champion-roles to review)"
          labels: patch-update
          add-paths: |
            public/**
            src/data/lcuData.js
            src/data/champSkins.js
            src/data/abilities.js
          body-path: patch-report.md
